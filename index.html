    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function generateUuid() {
      if (crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        success: 'bg-emerald-600 text-white',
        danger: 'bg-[#E64964] text-white',
        warning: 'bg-[#F7A928] text-[#1E2046]',
        info: 'bg-[#2B2475] text-white'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg text-xs font-bold flex items-center gap-2.5 transition-all duration-300 ${colors[type] || colors.info}`;
      el.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-8px)';
        setTimeout(() => el.remove(), 300);
      }, 3400);
    }
    window.showToast = showToast;

    async function autoSetupDatabase() {
      if (IS_PREVIEW) {
        try {
          const saved = localStorage.getItem('edupro_cbt_preview_db');
          if (saved) {
            const parsed = JSON.parse(saved);
            state.db = { ...createInitialDataset(), ...parsed };
            state.db.pengaturan_sekolah = {
              ...createInitialDataset().pengaturan_sekolah,
              ...(parsed.pengaturan_sekolah || {})
            };
          } else {
            state.db = createInitialDataset();
            persistPreview();
          }
        } catch (e) {
          state.db = createInitialDataset();
        }
        sortSiswaAlphabetically();
        return;
      }

      if (!supabase) return;
      try {
        const { data: kelasExisting } = await supabase.from('kelas').select('id').limit(1);
        if (!kelasExisting || kelasExisting.length === 0) {
          const seed = createInitialDataset();
          await supabase.from('pengaturan_sekolah').upsert([seed.pengaturan_sekolah]);
          await supabase.from('kelas').insert(seed.kelas);
          await supabase.from('siswa').insert(seed.siswa);
          await supabase.from('jadwal_pelajaran').insert(seed.jadwal_pelajaran);
          await supabase.from('jurnal_mengajar').insert(seed.jurnal_mengajar);
          await supabase.from('daftar_hadir').insert(seed.daftar_hadir);
          await supabase.from('buku_nilai').insert(seed.buku_nilai);
          await supabase.from('bimbingan_wali').insert(seed.bimbingan_wali);
          await supabase.from('cbt_ujian').insert(seed.cbt_ujian);
          await supabase.from('cbt_soal').insert(seed.cbt_soal);
          await supabase.from('cbt_hasil').insert(seed.cbt_hasil);
        }
        await loadAllFromSupabase();
      } catch (err) {
        console.error('Auto setup error:', err);
      }
    }

    async function loadAllFromSupabase() {
      if (!supabase) return;
      const tables = ['kelas', 'siswa', 'jadwal_pelajaran', 'jurnal_mengajar', 'daftar_hadir', 'buku_nilai', 'bimbingan_wali', 'cbt_ujian', 'cbt_soal', 'cbt_hasil'];
      const { data: sek } = await supabase.from('pengaturan_sekolah').select('*').limit(1).maybeSingle();
      if (sek) {
        state.db.pengaturan_sekolah = { ...createInitialDataset().pengaturan_sekolah, ...sek };
      }
      for (const t of tables) {
        const { data } = await supabase.from(t).select('*');
        if (data) state.db[t] = data;
      }
      sortSiswaAlphabetically();
    }

    async function dbInsert(table, row) {
      if (!IS_PREVIEW && supabase) {
        const { error } = await supabase.from(table).insert([row]);
        if (error) {
          showToast('Gagal menyimpan ke Supabase: ' + error.message, 'danger');
          return false;
        }
      }
      state.db[table].push(row);
      if (table === 'siswa') sortSiswaAlphabetically();
      persistPreview();
      return true;
    }

    async function dbUpsert(table, rows) {
      if (!IS_PREVIEW && supabase) {
        const { error } = await supabase.from(table).upsert(rows);
        if (error) {
          showToast('Gagal memperbarui Supabase: ' + error.message, 'danger');
          return false;
        }
      }
      rows.forEach(r => {
        const idx = state.db[table].findIndex(item => item.id === r.id);
        if (idx >= 0) state.db[table][idx] = r;
        else state.db[table].push(r);
      });
      if (table === 'siswa') sortSiswaAlphabetically();
      persistPreview();
      return true;
    }

    async function dbDelete(table, id) {
      if (!IS_PREVIEW && supabase) {
        const { error } = await supabase.from(table).delete().eq('id', id);
        if (error) {
          showToast('Gagal menghapus data: ' + error.message, 'danger');
          return false;
        }
      }
      state.db[table] = state.db[table].filter(item => item.id !== id);
      persistPreview();
      return true;
    }

    window.handleSiswaLogin = async function(e) {
      e.preventDefault();
      const uname = e.target.username.value.trim();
      const pwd = e.target.password.value.trim();

      if (!IS_PREVIEW && supabase) {
        const { data, error } = await supabase
          .from('siswa')
          .select('*')
          .or(`username.eq.${uname},nisn.eq.${uname}`)
          .eq('password', pwd)
          .maybeSingle();

        if (error || !data) {
          showToast('Username/NISN atau Password siswa tidak cocok.', 'danger');
          return;
        }
        if (!data.status_aktif) {
          showToast('Akun Anda berstatus NONAKTIF (selesai ujian / pelanggaran). Hubungi Admin untuk persetujuan login kembali.', 'danger');
          return;
        }
        await loadAllFromSupabase();
        state.currentUser = { role: 'siswa', data };
        state.route = 'siswa-portal';
        showToast(`Selamat datang, ${data.nama_lengkap}!`, 'success');
        render();
        return;
      }

      await autoSetupDatabase();
      const found = state.db.siswa.find(
        s => (s.username.toLowerCase() === uname.toLowerCase() || s.nisn === uname) && s.password === pwd
      );
      if (!found) {
        showToast('Username/NISN atau Password siswa tidak valid!', 'danger');
        return;
      }
      if (!found.status_aktif) {
        showToast('Akun Anda berstatus NONAKTIF (selesai ujian / pelanggaran). Hubungi Admin untuk persetujuan login kembali.', 'danger');
        return;
      }
      state.currentUser = { role: 'siswa', data: found };
      state.route = 'siswa-portal';
      showToast(`Selamat datang, ${found.nama_lengkap}!`, 'success');
      render();
    };

        <form onsubmit="window.saveKelas(event, '${k ? k.id : ''}')" class="space-y-4">

          <div>
            <label class="block text-xs font-bold text-[#1E2046] mb-1">Tingkat</label>
            <select name="tingkat" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F6F7FB] border border-[#ECEEF5] text-sm font-semibold">

          </div>
          <label class="flex items-center gap-2.5 text-xs font-bold text-[#1E2046] cursor-pointer">
            <input type="checkbox" name="is_wali_kelas" ${k && k.is_wali_kelas ? 'checked' : ''} class="accent-[#2B2475]" />

          <div class="flex justify-end gap-2 pt-3 border-t border-[#ECEEF5]">

          </div>
        </form>
      `, 'max-w-md');
    };

    window.saveKelas = async function(e, existingId) {
      e.preventDefault();
      const f = e.target;
      const row = {
        id: existingId || generateUuid(),
        nama_kelas: f.nama_kelas.value.trim(),
        tingkat: f.tingkat.value,
        is_wali_kelas: f.is_wali_kelas.checked
      };
      await dbUpsert('kelas', [row]);
      window.closeModal();
      showToast('Data kelas berhasil disimpan.', 'success');
      render();
    };

    window.deleteKelas = function(id) {
      confirmAction('Hapus Data Kelas', 'Menghapus kelas juga akan memengaruhi data siswa terkait. Lanjutkan?', async () => {
        await dbDelete('kelas', id);
        showToast('Kelas dihapus.', 'info');
        render();
      });
    };

    // =========================================================================
    // 10. MENU 3: DATA SISWA (IMPORT CSV & PILIHAN BIMBINGAN WALI / BUKAN)
    // =========================================================================
    function renderMenuSiswa() {
      const q = state.searchQuery.toLowerCase();
      const filtered = state.db.siswa
        .filter(s => {
          const matchClass = state.selectedClassFilter === 'ALL' || s.kelas_id === state.selectedClassFilter;
          const matchQuery = !q || s.nama_lengkap.toLowerCase().includes(q) || s.nisn.includes(q) || s.username.toLowerCase().includes(q);
          return matchClass && matchQuery;
        })
        .sort((a, b) =>
          String(a.nama_lengkap || '').trim().localeCompare(String(b.nama_lengkap || '').trim(), 'id', { sensitivity: 'base' })
        );
      const inactiveCount = state.db.siswa.filter(s => !s.status_aktif).length;

      return `
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="font-display font-extrabold text-xl text-[#1E2046]">Data Peserta Didik & Akun CBT</h2>

          <div class="flex flex-wrap items-center gap-2">
            ${inactiveCount > 0 ? `
              <button onclick="window.approveAllSiswaAktif()" class="px-4 py-2.5 rounded-2xl bg-emerald-500/15 text-emerald-700 border border-emerald-500/30 text-xs font-bold flex items-center gap-2 hover:bg-emerald-500/25 transition">

                <span>Setujui Semua Akun (${inactiveCount})</span>

              <i data-lucide="upload" class="w-4 h-4 text-[#4BA3E3]"></i>
              <span>Import CSV Siswa</span>
            </button>
            <button onclick="window.openSiswaModal()" class="px-5 py-2.5 rounded-2xl bg-[#2B2475] text-white text-xs font-bold shadow-indigoGlow flex items-center gap-2">
              <i data-lucide="user-plus" class="w-4 h-4 text-[#F7A928]"></i>
              <span>Tambah Siswa</span>
            </button>
          </div>
        </div>

        <div class="bg-white rounded-[28px] p-5 shadow-card border border-[#ECEEF5] overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="border-b border-[#ECEEF5] text-[#8E92BC] text-[11px] uppercase">

                <th class="py-3 px-3">Nama Lengkap</th>
                <th class="py-3 px-3">Kelas</th>

                <th class="py-3 px-3 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-[#ECEEF5]">
              ${filtered.length === 0 ? `
                <tr><td colspan="6" class="py-8 text-center text-[#8E92BC]">Tidak ada data siswa yang sesuai filter.</td></tr>
              ` : filtered.map(s => {
                const kls = state.db.kelas.find(k => k.id === s.kelas_id);
                return `
                  <tr class="hover:bg-[#F6F7FB]/70 transition">
                    <td class="py-3 px-3 font-mono font-semibold text-[#4A4E69]">${escapeHtml(s.nisn)}</td>
                    <td class="py-3 px-3">
                      <div class="font-bold text-[#1E2046]">${escapeHtml(s.nama_lengkap)}</div>
                      <div class="text-[10px] text-[#8E92BC]">${s.jenis_kelamin === 'P' ? 'Perempuan' : 'Laki-laki'}</div>
                    </td>
                    <td class="py-3 px-3 font-semibold">${escapeHtml(kls ? kls.nama_kelas : '-')}</td>
                    <td class="py-3 px-3 font-mono text-[11px]">
                      <div>
                        <span class="px-2 py-0.5 rounded bg-[#F6F7FB] font-bold text-[#2B2475]">${escapeHtml(s.username)}</span> /
                        <span class="text-[#8E92BC]">${escapeHtml(s.password)}</span>
                      </div>
                      <button onclick="window.toggleSiswaAktif('${s.id}')"
                        class="mt-1.5 font-sans inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold transition ${
                          s.status_aktif
                            ? 'bg-emerald-500/15 text-emerald-700 hover:bg-emerald-500/25'
                            : 'bg-[#E64964]/15 text-[#E64964] hover:bg-[#E64964]/25'
                        }">
                        ${s.status_aktif ? '● Aktif' : '✕ Nonaktif • Setujui Login'}
                      </button>
                    </td>
                    <td class="py-3 px-3">
                      <button onclick="window.toggleSiswaWali('${s.id}')"
                        class="px-3 py-1.5 rounded-full text-[11px] font-bold transition ${

                            ? 'bg-[#F7A928]/20 text-amber-800 border border-[#F7A928]/40'
                            : 'bg-[#F6F7FB] text-[#8E92BC] border border-[#ECEEF5]'
                        }">
                        ${s.is_bimbingan_wali ? '★ Bimbingan Wali' : 'Bukan Bimbingan Wali'}
                      </button>
                    </td>
                    <td class="py-3 px-3 text-right space-x-1">
                      <button onclick="window.openSiswaModal('${s.id}')" class="px-2.5 py-1.5 rounded-xl bg-[#F6F7FB] hover:bg-[#ECEEF5] font-bold text-[#1E2046]">Edit</button>
                      <button onclick="window.deleteSiswa('${s.id}')" class="px-2.5 py-1.5 rounded-xl bg-[#E64964]/10 text-[#E64964] font-bold">Hapus</button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    window.toggleSiswaAktif = async function(siswaId) {
      const s = state.db.siswa.find(item => item.id === siswaId);
      if (!s) return;
      const updated = { ...s, status_aktif: !s.status_aktif };
      await dbUpsert('siswa', [updated]);
      showToast(
        updated.status_aktif
          ? `Akun ${updated.nama_lengkap} disetujui & diaktifkan kembali!`
          : `Akun ${updated.nama_lengkap} dinonaktifkan.`,
        updated.status_aktif ? 'success' : 'info'
      );
      render();
    };

    window.approveAllSiswaAktif = async function() {
      const inactiveList = state.db.siswa.filter(s => !s.status_aktif);
      if (inactiveList.length === 0) return;
      const updatedRows = inactiveList.map(s => ({ ...s, status_aktif: true }));
      await dbUpsert('siswa', updatedRows);
      showToast(`${updatedRows.length} akun siswa berhasil disetujui dan diaktifkan kembali!`, 'success');
      render();
    };

    window.toggleSiswaWali = async function(siswaId) {
      const s = state.db.siswa.find(item => item.id === siswaId);
      if (!s) return;
      const updated = { ...s, is_bimbingan_wali: !s.is_bimbingan_wali };
      await dbUpsert('siswa', [updated]);
      showToast(`Status ${updated.nama_lengkap}: ${updated.is_bimbingan_wali ? 'Bimbingan Wali' : 'Bukan Bimbingan Wali'}`, 'info');
      render();
    };

    window.openSiswaModal = function(siswaId = null) {
      const s = siswaId ? state.db.siswa.find(item => item.id === siswaId) : null;
      const defaultUser = 'siswa' + (state.db.siswa.length + 1);
      openModal(s ? 'Edit Data Siswa' : 'Tambah Siswa Baru', `
        <form onsubmit="window.saveSiswa(event, '${s ? s.id : ''}')" class="space-y-4">
          <div class="grid sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-[#1E2046] mb-1">NISN</label>
              <input type="text" name="nisn" value="${s ? escapeHtml(s.nisn) : ''}" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F6F7FB] border border-[#ECEEF5] text-xs font-mono" />
            </div>
            <div>
              <label class="block text-xs font-bold text-[#1E2046] mb-1">Kelas</label>
              <select name="kelas_id" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F6F7FB] border border-[#ECEEF5] text-xs font-bold">
                ${state.db.kelas.map(k => `<option value="${k.id}" ${s && s.kelas_id === k.id ? 'selected' : ''}>${escapeHtml(k.nama_kelas)}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="grid sm:grid-cols-3 gap-3">
            <div class="sm:col-span-2">
              <label class="block text-xs font-bold text-[#1E2046] mb-1">Nama Lengkap Siswa</label>
              <input type="text" name="nama_lengkap" value="${s ? escapeHtml(s.nama_lengkap) : ''}" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F6F7FB] border border-[#ECEEF5] text-xs font-semibold" />
            </div>
            <div>
              <label class="block text-xs font-bold text-[#1E2046] mb-1">Jenis Kelamin</label>
              <select name="jenis_kelamin" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F6F7FB] border border-[#ECEEF5] text-xs font-bold">
                <option value="L" ${!s || s.jenis_kelamin === 'L' ? 'selected' : ''}>Laki-laki (L)</option>
                <option value="P" ${s && s.jenis_kelamin === 'P' ? 'selected' : ''}>Perempuan (P)</option>
              </select>
            </div>
          </div>

          <div class="grid sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-[#1E2046] mb-1">Username Login CBT</label>
              <input type="text" name="username" value="${s ? escapeHtml(s.username) : defaultUser}" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F6F7FB] border border-[#ECEEF5] text-xs font-mono font-bold" />
            </div>
            <div>
              <label class="block text-xs font-bold text-[#1E2046] mb-1">Password CBT</label>
              <input type="text" name="password" value="${s ? escapeHtml(s.password) : '123456'}" required class="w-full px-3.5 py-2.5 rounded-xl bg-[#F6F7FB] border border-[#ECEEF5] text-xs font-mono" />
            </div>
          </div>

          <div class="grid sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-[#1E2046] mb-1">Pilihan Bimbingan Guru Wali</label>
              <select name="is_bimbingan_wali" class="w-full px-3.5 py-2.5 rounded-xl bg-[#F6F7FB] border border-[#ECEEF5] text-xs font-bold text-[#2B2475]">

                <option value="true" ${!s || s.status_aktif ? 'selected' : ''}>Aktif (Diizinkan Login)</option>
                <option value="false" ${s && !s.status_aktif ? 'selected' : ''}>Nonaktif (Perlu Persetujuan Admin)</option>

            <button type="submit" class="px-5 py-2 rounded-xl bg-[#2B2475] text-white text-xs font-bold">Simpan Siswa</button>
          </div>
        </form>
      `);

    window.saveSiswa = async function(e, existingId) {
      e.preventDefault();
      const f = e.target;
      const row = {
        id: existingId || generateUuid(),
        nisn: f.nisn.value.trim(),
        kelas_id: f.kelas_id.value,
        nama_lengkap: f.nama_lengkap.value.trim(),
        jenis_kelamin: f.jenis_kelamin.value,
        username: f.username.value.trim(),
        password: f.password.value.trim(),
        is_bimbingan_wali: f.is_bimbingan_wali.value === 'true',
        status_aktif: f.status_aktif ? f.status_aktif.value === 'true' : true
      };
      await dbUpsert('siswa', [row]);
      window.closeModal();
      showToast('Data siswa berhasil disimpan.', 'success');
      render();
    };

    window.deleteSiswa = function(id) {
      confirmAction('Hapus Data Siswa', 'Yakin ingin menghapus siswa ini dari database?', async () => {
        await dbDelete('siswa', id);
        showToast('Data siswa dihapus.', 'info');
        render();
      });
    };

    window.processImportSiswa = async function(e) {
      e.preventDefault();
      const kelasId = e.target.kelas_id.value;
      const lines = e.target.csv_text.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const newRows = [];

      lines.forEach((line, idx) => {
        if (idx === 0 && line.toUpperCase().startsWith('NISN')) return;
        const cols = line.split(/[,;\t]/).map(c => c.trim());
        if (cols.length >= 2) {
          const nisn = cols[0] || String(Date.now() + idx);
          const nama = cols[1];
          const jk = (cols[2] || 'L').toUpperCase().startsWith('P') ? 'P' : 'L';
          const uname = cols[3] || `siswa_${nisn.slice(-4)}`;
          const pwd = cols[4] || '123456';
          const wali = ['YA', 'YES', 'TRUE', '1', 'WALI'].includes((cols[5] || '').toUpperCase());
          newRows.push({
            id: generateUuid(),
            kelas_id: kelasId,
            nisn,
            nama_lengkap: nama,
            jenis_kelamin: jk,
            username: uname,
            password: pwd,
            is_bimbingan_wali: wali,
            status_aktif: true
          });
        }
      });

      if (newRows.length === 0) {
        showToast('Tidak ada baris siswa valid yang terdeteksi.', 'warning');
        return;
      }

      newRows.sort((a, b) =>
        String(a.nama_lengkap || '').trim().localeCompare(String(b.nama_lengkap || '').trim(), 'id', { sensitivity: 'base' })
      );

      await dbUpsert('siswa', newRows);
      window.closeModal();
      showToast(`${newRows.length} siswa berhasil diimpor & diurutkan A-Z!`, 'success');
      render();
    };

    // =========================================================================
    const HARI_INDONESIA = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

    function getHariFromDateStr(dateStr) {
      if (!dateStr) return 'Senin';
      const dt = new Date(dateStr + 'T00:00:00');
      if (isNaN(dt.getTime())) return 'Senin';
      return HARI_INDONESIA[dt.getDay()];
    }

    function normalizeJamKey(jamStr) {
      return String(jamStr || '1 - 2').replace(/\s+/g, '').toLowerCase();
    }

    function getAbsensiMeetingMeta(kelasId, tanggalStr, jamOverride = '') {
      const hariName = getHariFromDateStr(tanggalStr);
      const classSchedules = state.db.jadwal_pelajaran.filter(j => j.kelas_id === kelasId);
      const matchingSchedule = classSchedules.find(j => j.hari.toLowerCase() === hariName.toLowerCase());

      const resolvedJam = (jamOverride && jamOverride.trim())
        ? jamOverride.trim()
        : (matchingSchedule ? matchingSchedule.jam_ke : (classSchedules[0]?.jam_ke || '1 - 2'));

      const normJam = normalizeJamKey(resolvedJam);

      const classRecords = state.db.daftar_hadir.filter(h => h.kelas_id === kelasId);
      const sessionMap = new Map();

      classRecords.forEach(rec => {
        const recJam = normalizeJamKey(rec.jam_ke || '1 - 2');
        if (recJam === normJam && rec.tanggal) {
          if (!sessionMap.has(rec.tanggal)) {
            sessionMap.set(rec.tanggal, {
              tanggal: rec.tanggal,
              jam_ke: rec.jam_ke || resolvedJam,
              pertemuan_ke: rec.pertemuan_ke || null
            });
          }
        }
      });

      const sortedPastDates = Array.from(sessionMap.keys()).sort();
      let pertemuanKe = 1;
      let isExistingSession = false;

      if (sessionMap.has(tanggalStr)) {
        isExistingSession = true;
        const idx = sortedPastDates.indexOf(tanggalStr);
        pertemuanKe = idx + 1;
      } else {
        const earlierDates = sortedPastDates.filter(d => d < tanggalStr);
        pertemuanKe = earlierDates.length + 1;
      }

      const historySessions = sortedPastDates.map((d, idx) => ({
        tanggal: d,
        pertemuan_ke: idx + 1,
        jam_ke: sessionMap.get(d).jam_ke
      }));

      return {
        hariName,
        jam_ke: resolvedJam,
        mata_pelajaran: matchingSchedule ? matchingSchedule.mata_pelajaran : 'Mata Pelajaran Kelas',
        pertemuan_ke: pertemuanKe,
        isExistingSession,
        historySessions,
        availableSchedules: classSchedules
      };
    }

    window.setDraftAbsensi = function(siswaId, status) {
      state.absensiDraft[siswaId] = { ...(state.absensiDraft[siswaId] || {}), status };

    window.setDraftAbsensiKet = function(siswaId, keterangan) {
      state.absensiDraft[siswaId] = { ...(state.absensiDraft[siswaId] || {}), keterangan };
    };
    window.setAllHadir = function() {
      state.db.siswa.filter(s => s.kelas_id === state.absensiKelasId).forEach(s => {
        state.absensiDraft[s.id] = { ...(state.absensiDraft[s.id] || {}), status: 'H' };
      });
      render();
    };
    window.saveBatchAbsensi = async function() {
      const students = state.db.siswa.filter(s => s.kelas_id === state.absensiKelasId);
      const meta = getAbsensiMeetingMeta(state.absensiKelasId, state.absensiTanggal, state.absensiJamKe);
      const normJam = normalizeJamKey(meta.jam_ke);

      const rows = students.map(s => {
        const existing = state.db.daftar_hadir.find(
          h => h.siswa_id === s.id && h.tanggal === state.absensiTanggal && normalizeJamKey(h.jam_ke || meta.jam_ke) === normJam
        );
        const draft = state.absensiDraft[s.id] || {};
        return {
          id: existing ? existing.id : generateUuid(),
          siswa_id: s.id,
          kelas_id: state.absensiKelasId,
          tanggal: state.absensiTanggal,
          jam_ke: meta.jam_ke,
          pertemuan_ke: meta.pertemuan_ke,
          status: draft.status || existing?.status || 'H',
          keterangan: draft.keterangan ?? existing?.keterangan ?? ''
        };
      });
      await dbUpsert('daftar_hadir', rows);
      state.absensiDraft = {};
      showToast(`Presensi Pertemuan Ke-${meta.pertemuan_ke} (Jam ${meta.jam_ke}) berhasil disimpan!`, 'success');
      render();
    };

    // MENU 7: BUKU NILAI (INPUT, EDIT NILAI TERSIMPAN & REKAP OTOMATIS)

    function getExistingJudulNilai(kelasId, kategori) {
      const seen = new Set();
      const list = [];
      state.db.buku_nilai.forEach(n => {
        if (n.kelas_id === kelasId && n.kategori === kategori) {
          const title = String(n.judul_penilaian || '').trim();
          const key = title.toLowerCase();
          if (title && !seen.has(key)) {
            seen.add(key);
            list.push(title);
          }
        }
      });
      return list;
    }

    function getInputtedNilaiCategories(kelasId) {
      const order = ['Tugas', 'UH', 'STS', 'SAS'];
      const classRecords = state.db.buku_nilai.filter(n => n.kelas_id === kelasId);
      const foundSet = new Set(classRecords.map(n => String(n.kategori || '').trim()).filter(Boolean));
      const sorted = order.filter(cat => foundSet.has(cat));
      foundSet.forEach(cat => {
        if (!sorted.includes(cat)) sorted.push(cat);
      });
      return sorted;
    }

    function getInputtedNilaiColumns(kelasId, kategoriFilter = 'ALL') {
      const order = ['Tugas', 'UH', 'STS', 'SAS'];
      const classRecords = state.db.buku_nilai.filter(n => {
        const matchKelas = n.kelas_id === kelasId;
        const matchKat = kategoriFilter === 'ALL' || n.kategori === kategoriFilter;
        return matchKelas && matchKat;
      });

      const seen = new Set();
      const cols = [];
      classRecords.forEach(n => {
        const kat = String(n.kategori || '').trim();
        const judul = String(n.judul_penilaian || kat).trim();
        const key = `${kat.toLowerCase()}::${judul.toLowerCase()}`;
        if (kat && judul && !seen.has(key)) {
          seen.add(key);
          cols.push({ kategori: kat, judul_penilaian: judul });
        }
      });

      return cols.sort((a, b) => {
        const idxA = order.indexOf(a.kategori);
        const idxB = order.indexOf(b.kategori);
        const rankA = idxA === -1 ? 99 : idxA;
        const rankB = idxB === -1 ? 99 : idxB;
        if (rankA !== rankB) return rankA - rankB;
        return 0;
      });
    }

    window.saveBatchNilai = async function() {
      const students = state.db.siswa.filter(s => s.kelas_id === state.nilaiKelasId);
      const judulClean = String(state.nilaiJudul || '').trim() || state.nilaiKategori;
      const normJudul = judulClean.toLowerCase();
      const upsertRows = [];
      const deleteIds = [];

      students.forEach(s => {
        const existing = state.db.buku_nilai.find(
          n => n.siswa_id === s.id &&
            n.kelas_id === state.nilaiKelasId &&
            n.kategori === state.nilaiKategori &&
            String(n.judul_penilaian || '').trim().toLowerCase() === normJudul
        );
        const hasDraft = Object.prototype.hasOwnProperty.call(state.nilaiDraft, s.id);
        const rawVal = hasDraft ? state.nilaiDraft[s.id] : (existing ? String(existing.nilai) : '');

        if (rawVal !== undefined && rawVal !== null && String(rawVal).trim() !== '') {
          const parsedNum = Number(rawVal);
          if (!Number.isNaN(parsedNum)) {
            const clampedNilai = Math.max(0, Math.min(100, parsedNum));
            upsertRows.push({
              id: existing ? existing.id : generateUuid(),
              siswa_id: s.id,
              kelas_id: state.nilaiKelasId,
              kategori: state.nilaiKategori,
              judul_penilaian: judulClean,
              nilai: clampedNilai,
              catatan: existing?.catatan || ''
            });
          }
        } else if (hasDraft && String(rawVal).trim() === '' && existing) {
          deleteIds.push(existing.id);
        }
      });

      if (upsertRows.length === 0 && deleteIds.length === 0) {
        showToast('Isi minimal satu nilai siswa terlebih dahulu.', 'warning');
        return;
      }

      if (upsertRows.length > 0) {
        await dbUpsert('buku_nilai', upsertRows);
      }
      for (const delId of deleteIds) {
        await dbDelete('buku_nilai', delId);
      }

      state.nilaiDraft = {};
      showToast(`Nilai "${judulClean}" berhasil disimpan & diperbarui otomatis!`, 'success');
      render();
    };

    const SAMPLE_BULK_SOAL_TEXT = `1. Perangkat keras komputer yang berfungsi sebagai otak pemroses utama instruksi program adalah...
A. RAM

6. [JENIS: ESSAY]

KUNCI: Melindungi akun dari akses tidak sah meski kata sandi bocor.
BOBOT: 20`;

    function parseBulkSoalText(rawText) {
      if (!rawText || !rawText.trim()) return [];
      const blocks = rawText.trim().split(/\n\s*\n+/);
      const results = [];

      blocks.forEach((block, idx) => {
        const lines = block.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) return;

        let jenis = 'PG';
        let bobot = 10;
        let kunciRaw = '';
        const questionLines = [];
        const opsiMap = {};
        const bsItems = [];
        const bsKeys = [];
        const matchPairs = [];
        const matchKeys = {};

        lines.forEach(line => {
          const jenisMatch = line.match(/\[JENIS:\s*([A-Z_]+)\]/i);
          if (jenisMatch) {
            const candidate = jenisMatch[1].toUpperCase();
            if (JENIS_SOAL_LABELS[candidate]) jenis = candidate;
            const cleaned = line.replace(/\[JENIS:\s*[A-Z_]+\]/i, '').trim();
            if (cleaned) questionLines.push(cleaned);
            return;
          }
          if (/^BOBOT\s*:/i.test(line)) {
            bobot = Number(line.replace(/^BOBOT\s*:/i, '').trim()) || 10;
            return;
          }
          if (/^KUNCI\s*:/i.test(line)) {
            kunciRaw = line.replace(/^KUNCI\s*:/i, '').trim();
            return;
          }
          const optMatch = line.match(/^([A-E])[\.\)]\s*(.+)$/i);
          if (optMatch) {
            opsiMap[optMatch[1].toUpperCase()] = optMatch[2].trim();
            return;
          }
          if (line.startsWith('-') && line.includes('|')) {
            const [stmt, ans] = line.slice(1).split('|').map(x => x.trim());
            if (stmt) {
              bsItems.push(stmt);
              bsKeys.push(/^B/i.test(ans || '') ? 'Benar' : 'Salah');
            }
            return;
          }
          if (line.startsWith('-') && line.includes('=')) {
            const [kiri, kanan] = line.slice(1).split('=').map(x => x.trim());
            if (kiri && kanan) {
              matchPairs.push({ kiri, kanan });
              matchKeys[kiri] = kanan;
            }
            return;
          }
          questionLines.push(line.replace(/^\d+[\.\)]\s*/, ''));
        });

        const pertanyaan = questionLines.join(' ').trim();
        if (!pertanyaan) return;

        if (bsItems.length > 0) jenis = 'BENAR_SALAH';
        else if (matchPairs.length > 0) jenis = 'MENJODOHKAN';
        else if (Object.keys(opsiMap).length === 0 && jenis === 'PG') {
          jenis = kunciRaw && kunciRaw.length <= 40 ? 'ISIAN_SINGKAT' : 'ESSAY';
        }

        let opsi_data = {};
        let kunci_jawaban = kunciRaw;

        if (jenis === 'PG') {
          opsi_data = opsiMap;
          kunci_jawaban = (kunciRaw || 'A').toUpperCase();
        } else if (jenis === 'PG_KOMPLEKS') {
          opsi_data = opsiMap;
          kunci_jawaban = kunciRaw.split(',').map(x => x.trim().toUpperCase()).filter(Boolean);
        } else if (jenis === 'BENAR_SALAH') {
          opsi_data = { pernyataan: bsItems };
          kunci_jawaban = bsKeys;
        } else if (jenis === 'MENJODOHKAN') {
          opsi_data = { pasangan: matchPairs };
          kunci_jawaban = matchKeys;
        } else if (jenis === 'ISIAN_SINGKAT') {
          opsi_data = { petunjuk: 'Isian singkat' };
          kunci_jawaban = kunciRaw.split(',').map(x => x.trim()).filter(Boolean);
        } else {
          opsi_data = { rubrik: kunciRaw || 'Rubrik guru' };
          kunci_jawaban = kunciRaw || 'Rubrik guru';
        }

        results.push({
          nomor_urut: idx + 1,
          jenis_soal: jenis,
          pertanyaan,
          opsi_data,
          kunci_jawaban,
          bobot
        });
      });

      return results;
    }

    function renderLaporanSectionNilai() {
      const students = getFilteredStudentsForReport();
      const rows = students.map(s => {
        const kls = state.db.kelas.find(k => k.id === s.kelas_id);
        const scores = state.db.buku_nilai.filter(n => n.siswa_id === s.id);
        const calcAvg = (cat) => {
          const list = scores.filter(x => x.kategori === cat);
          return list.length ? Math.round(list.reduce((a, b) => a + Number(b.nilai), 0) / list.length) : null;
        };
        const t = calcAvg('Tugas');
        const uh = calcAvg('UH');
        const sts = calcAvg('STS');
        const sas = calcAvg('SAS');
        const avail = [t, uh, sts, sas].filter(v => v !== null);
        const akhir = avail.length ? Math.round(avail.reduce((a, b) => a + b, 0) / avail.length) : 0;
        const pred = akhir >= 90 ? 'A' : akhir >= 80 ? 'B' : akhir >= 70 ? 'C' : 'D';
        return { s, kls, t, uh, sts, sas, akhir, pred, tuntas: akhir >= 75 };
      });

      const avgKelas = rows.length ? Math.round(rows.reduce((a, b) => a + b.akhir, 0) / rows.length) : 0;
      const tuntasCount = rows.filter(r => r.tuntas).length;

                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">Kelas</th>
                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">Tugas</th>
                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">UH</th>
                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">STS</th>
                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">SAS</th>
                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">Nilai Akhir</th>
                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">Predikat</th>
                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">Keterangan</th>
                </tr>
              </thead>
              <tbody>
                ${rows.length === 0 ? `
                  <tr><td colspan="11" class="py-4 text-center text-[#8E92BC] border border-[#DCE1EF]">Belum ada data nilai siswa.</td></tr>

                  <tr class="${i % 2 === 1 ? 'bg-[#F6F7FB]/60' : 'bg-white'}">
                    <td class="py-2 px-3 border border-[#DCE1EF] text-center">${i + 1}</td>

                    <td class="py-2 px-3 border border-[#DCE1EF] text-center">${r.t ?? '-'}</td>
                    <td class="py-2 px-3 border border-[#DCE1EF] text-center">${r.uh ?? '-'}</td>
                    <td class="py-2 px-3 border border-[#DCE1EF] text-center">${r.sts ?? '-'}</td>
                    <td class="py-2 px-3 border border-[#DCE1EF] text-center">${r.sas ?? '-'}</td>
                    <td class="py-2 px-3 border border-[#DCE1EF] text-center font-extrabold text-[#2B2475]">${r.akhir}</td>
                    <td class="py-2 px-3 border border-[#DCE1EF] text-center font-bold">${r.pred}</td>
                    <td class="py-2 px-3 border border-[#DCE1EF] text-center text-[11px] font-semibold ${r.tuntas ? 'text-emerald-600' : 'text-[#E64964]'}">

    function renderLaporanSectionAbsensi() {
      const students = getFilteredStudentsForReport();
      let totalH = 0, totalAll = 0;

      const rows = students.map(s => {
        const kls = state.db.kelas.find(k => k.id === s.kelas_id);
        const recs = state.db.daftar_hadir.filter(h => h.siswa_id === s.id);
        const H = recs.filter(r => r.status === 'H').length;
        const S = recs.filter(r => r.status === 'S').length;
        const I = recs.filter(r => r.status === 'I').length;
        const A = recs.filter(r => r.status === 'A').length;
        const tot = recs.length;
        const pct = tot > 0 ? Math.round((H / tot) * 100) : 100;
        totalH += H;
        totalAll += tot;
        return { s, kls, H, S, I, A, tot, pct };
      });

      const avgPct = totalAll > 0 ? Math.round((totalH / totalAll) * 100) : 100;

      return `
        <section class="report-section-block space-y-3">

                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">Hadir (H)</th>
                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">Sakit (S)</th>
                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">Izin (I)</th>
                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">Alpa (A)</th>
                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">Pertemuan</th>
                  <th class="py-2.5 px-3 border border-[#2B2475] text-center">% Hadir</th>
                </tr>

    window.printReportDocument = function() {
      let pageStyle = document.getElementById('dynamic-print-page-style');
      if (!pageStyle) {
        pageStyle = document.createElement('style');
        pageStyle.id = 'dynamic-print-page-style';
        document.head.appendChild(pageStyle);
      }
      pageStyle.textContent = `@media print { @page { size: A4 ${state.laporanOrientasi}; margin: 12mm; } }`;
      window.print();
    };

    window.openCleanPrintWindow = function() {
      const reportEl = document.getElementById('printable-report-area');
      if (!reportEl) return;
      const win = window.open('', '_blank');
      if (!win) {
        showToast('Pop-up diblokir browser. Gunakan tombol Cetak / Simpan PDF.', 'warning');
        return;
      }
      const activeCat = LAPORAN_CATEGORIES.find(c => c.id === state.laporanJenis) || LAPORAN_CATEGORIES[0];
      win.document.write(`
        <!DOCTYPE html>
        <html lang="id">
        <head>
          <meta charset="UTF-8" />
          <title>${escapeHtml(activeCat.title)} — ${escapeHtml(state.db.pengaturan_sekolah.nama_sekolah)}</title>
          <script src="https://cdn.tailwindcss.com"><\/script>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
          <style>
            @page { size: A4 ${state.laporanOrientasi}; margin: 12mm; }
            body { font-family: 'Inter', sans-serif; color: #1E2046; background: #FFFFFF; margin: 0; padding: 16px; }
            .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
            .report-section-block { break-inside: avoid; page-break-inside: avoid; margin-bottom: 20px; }
            table.report-table thead { display: table-header-group; }
            table.report-table tr { break-inside: avoid; page-break-inside: avoid; }
            @media print {
              body { padding: 0; }
              .no-print-bar { display: none !important; }
            }
          </style>
        </head>
        <body>
          <div class="no-print-bar mb-4 p-3 rounded-xl bg-[#F6F7FB] border border-[#ECEEF5] flex items-center justify-between text-xs">
            <span>Pratinjau Dokumen PDF Siap Cetak (${state.laporanOrientasi.toUpperCase()} A4)</span>
            <button onclick="window.print()" class="px-4 py-2 rounded-lg bg-[#2B2475] text-white font-bold cursor-pointer">
              Cetak / Simpan sebagai PDF
            </button>
          </div>
          <div class="space-y-6">
            ${reportEl.innerHTML}
          </div>
          <script>
            setTimeout(() => { window.print(); }, 550);
          <\/script>
        </body>
        </html>
      `);
      win.document.close();
    };

    window.syncLogoPreview = function(fieldKey, urlVal) {
      const boxId = fieldKey === 'logo_daerah' ? 'preview-logo-daerah' : 'preview-logo-instansi';
      const box = document.getElementById(boxId);
      if (!box) return;
      const trimmed = String(urlVal || '').trim();
      if (trimmed) {
        box.innerHTML = `<img src="${escapeHtml(trimmed)}" alt="Logo" class="w-full h-full object-contain p-1" />`;
      } else {
        const iconName = fieldKey === 'logo_daerah' ? 'image' : 'school';
        box.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5 text-[#8E92BC]"></i>`;
        if (window.lucide) lucide.createIcons();
      }
    };

    window.handleLogoFileUpload = function(e, fieldKey) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 240;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/png');
          const inputId = fieldKey === 'logo_daerah' ? 'input-logo-daerah' : 'input-logo-instansi';
          const inputEl = document.getElementById(inputId);
          if (inputEl) inputEl.value = dataUrl;
          window.syncLogoPreview(fieldKey, dataUrl);
          showToast('Gambar logo berhasil dimuat. Klik Simpan Pengaturan Sekolah untuk menyimpan.', 'info');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

            <label class="block text-xs font-bold text-[#1E2046] mb-1">Masukkan Token Ujian dari Pengawas</label>

              class="w-full px-4 py-3 rounded-xl bg-[#F6F7FB] border border-[#ECEEF5] text-center font-mono font-extrabold text-base uppercase tracking-widest text-[#2B2475]" />

    window.verifyAndStartExam = function(e, ujianId) {
      e.preventDefault();
      const ujian = state.db.cbt_ujian.find(u => u.id === ujianId);
      const tokenInput = e.target.token.value.trim().toUpperCase();
      if (!ujian || tokenInput !== ujian.token_ujian.toUpperCase()) {
        showToast('Token ujian tidak valid! Periksa kembali token dari guru.', 'danger');
        return;
      }

      let questions = state.db.cbt_soal.filter(s => s.ujian_id === ujian.id);
      if (questions.length === 0) {
        showToast('Paket ujian ini belum memiliki butir soal.', 'warning');
        return;
      }
      if (ujian.acak_soal) {
        questions = [...questions].sort(() => Math.random() - 0.5);
      }

      window.closeModal();
      state.activeExam = ujian;
      state.examQuestions = questions;
      state.examCurrentIndex = 0;
      state.examAnswers = {};
      state.examFlags = {};
      state.examViolations = 0;
      state.examViolationLogs = [];
      state.examTimeLeftSec = ujian.durasi_menit * 60;
      state.examLockedModalOpen = false;
      state.route = 'siswa-exam';

      try {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      } catch (err) {}

      startExamAntiCheat();
      render();
    };

    function playWarningBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(520, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}
    }

    async function deactivateSiswaAccount(siswaId) {
      if (!siswaId) return;
      const idx = state.db.siswa.findIndex(s => String(s.id) === String(siswaId));
      if (idx >= 0) {
        state.db.siswa[idx] = { ...state.db.siswa[idx], status_aktif: false };
        persistPreview();
      }
      if (!IS_PREVIEW && supabase) {
        await supabase
          .from('siswa')
          .update({ status_aktif: false })
          .eq('id', siswaId);
      }
    }

    async function handleAntiCheatViolation(reason) {
      if (state.route !== 'siswa-exam' || !state.activeExam || state.examLockedModalOpen) return;
      state.examViolations += 1;
      const timeNow = new Date().toLocaleTimeString('id-ID');
      state.examViolationLogs.push(`${timeNow} — ${reason}`);
      playWarningBeep();

      // Otomatis ubah akun siswa menjadi tidak aktif saat pelanggaran terjadi
      await deactivateSiswaAccount(state.currentUser?.data?.id);

      const maxAllowed = state.activeExam.maks_pelanggaran || 3;
      if (state.examViolations >= maxAllowed) {
        showToast(`Batas pelanggaran (${maxAllowed}x) terlampaui! Ujian dikumpulkan otomatis & akun dinonaktifkan.`, 'danger');
        await window.submitExamAnswers(true);
      } else {
        state.examLockedModalOpen = true;
        render();
      }
    }

    function onVisibilityChange() {
      if (document.hidden) handleAntiCheatViolation('Meninggalkan tab / meminimalkan jendela ujian');
    }
    function onWindowBlur() {
      handleAntiCheatViolation('Fokus layar berpindah ke luar jendela ujian');
    }
    function onContextMenu(e) {
      if (state.route === 'siswa-exam') e.preventDefault();
    }
    function onCopyPaste(e) {
      if (state.route === 'siswa-exam') {
        e.preventDefault();
        showToast('Fitur salin/tempel dinonaktifkan selama ujian!', 'warning');
      }
    }
    function onKeyDownExam(e) {
      if (state.route !== 'siswa-exam') return;
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) || (e.ctrlKey && ['C', 'V', 'U', 'P'].includes(e.key.toUpperCase()))) {
        e.preventDefault();
        showToast('Pintasan keyboard diblokir oleh sistem anti-curang.', 'warning');
      }
    }

    function startExamAntiCheat() {
      stopExamAntiCheat();
      document.addEventListener('visibilitychange', onVisibilityChange);
      window.addEventListener('blur', onWindowBlur);
      document.addEventListener('contextmenu', onContextMenu);
      document.addEventListener('copy', onCopyPaste);
      document.addEventListener('cut', onCopyPaste);
      document.addEventListener('paste', onCopyPaste);
      document.addEventListener('keydown', onKeyDownExam);

      state.examTimerInterval = setInterval(() => {

        }

      window.removeEventListener('blur', onWindowBlur);

    function isQuestionAnswered(q, ans) {
      if (ans === undefined || ans === null) return false;
      if (typeof ans === 'string') return ans.trim().length > 0;
      if (Array.isArray(ans)) return ans.filter(Boolean).length > 0;
      if (typeof ans === 'object') return Object.values(ans).filter(Boolean).length > 0;
      return false;
    }

    window.confirmFinishExam = function() {
      confirmAction('Kumpulkan Jawaban Ujian', 'Apakah Anda yakin ingin mengakhiri ujian dan mengirimkan seluruh jawaban sekarang?', () => {
        window.submitExamAnswers(false);
      });
    };

    function normalizeTextForGrading(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function extractGradingKeywords(text) {
      const stopWords = new Set([
        'yang', 'dan', 'dari', 'untuk', 'dengan', 'pada', 'dalam', 'adalah', 'agar',
        'atau', 'sebagai', 'oleh', 'karena', 'tidak', 'bisa', 'dapat', 'jika', 'maka',
        'itu', 'ini', 'ke', 'di', 'serta', 'secara', 'tentang', 'menyebutkan', 'jelaskan',
        'mengapa', 'bagaimana', 'siswa', 'peserta', 'didik', 'rubrik', 'guru', 'penilaian'
      ]);
      const normalized = normalizeTextForGrading(text);
      if (!normalized) return [];
      const words = normalized.split(' ').filter(w => w.length >= 3 && !stopWords.has(w));
      return Array.from(new Set(words));
    }

    function isKeywordMatchedInAnswer(keyword, answerWords, normalizedAnswer) {
      if (normalizedAnswer.includes(keyword)) return true;
      if (keyword.length >= 6) {
        const stem = keyword.slice(0, 5);
        return answerWords.some(aw => aw.startsWith(stem) || (aw.length >= 5 && keyword.includes(aw)));
      }
      return false;
    }

    function gradeEssayAutomatically(question, rawAnswer) {
      const bobot = Number(question.bobot || 0);
      if (bobot <= 0) return 0;

      const normalizedAns = normalizeTextForGrading(rawAnswer);
      if (!normalizedAns) return 0;

      const ansWords = normalizedAns.split(' ').filter(Boolean);
      const rawRubric = [
        typeof question.kunci_jawaban === 'string' ? question.kunci_jawaban : '',
        question.opsi_data?.rubrik || ''
      ].filter(Boolean).join(' ');

      const cleanRubric = normalizeTextForGrading(rawRubric);
      const isGenericRubric = !cleanRubric || cleanRubric === 'rubrik guru' || cleanRubric === 'rubrik penilaian';

      if (!isGenericRubric && /[,;]/.test(rawRubric)) {
        const concepts = rawRubric
          .split(/[,;]/)
          .map(c => extractGradingKeywords(c))
          .filter(arr => arr.length > 0);

        if (concepts.length > 0) {
          let matchedConcepts = 0;
          concepts.forEach(conceptKeywords => {
            const hits = conceptKeywords.filter(kw => isKeywordMatchedInAnswer(kw, ansWords, normalizedAns)).length;
            if (hits / conceptKeywords.length >= 0.5) {
              matchedConcepts += 1;
            }
          });
          const ratio = matchedConcepts / concepts.length;
          if (ratio >= 0.85) return bobot;
          if (ratio > 0) return Math.round(ratio * bobot);
        }
      }

      const rubricKeywords = isGenericRubric ? [] : extractGradingKeywords(rawRubric);

      if (rubricKeywords.length > 0) {
        const matchedCount = rubricKeywords.filter(kw => isKeywordMatchedInAnswer(kw, ansWords, normalizedAns)).length;
        const ratio = matchedCount / rubricKeywords.length;
        if (ratio >= 0.7) return bobot;
        if (ratio > 0) return Math.round(ratio * bobot);
      }

      if (ansWords.length >= 8) return bobot;
      if (ansWords.length >= 5) return Math.round(bobot * 0.8);
      if (ansWords.length >= 3) return Math.round(bobot * 0.6);
      return Math.round(bobot * 0.4);
    }

    window.submitExamAnswers = async function(lockedByCheat = false) {
      stopExamAntiCheat();
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      } catch (e) {}

      let autoObjectiveScore = 0;
      let autoEssayScore = 0;

      state.examQuestions.forEach(q => {
        const ans = state.examAnswers[q.id];
        const bobot = Number(q.bobot || 0);
        if (!ans) return;

        if (q.jenis_soal === 'PG') {
          if (String(ans).trim().toUpperCase() === String(q.kunci_jawaban).trim().toUpperCase()) {
            autoObjectiveScore += bobot;
          }
        } else if (q.jenis_soal === 'PG_KOMPLEKS') {
          const k = Array.isArray(q.kunci_jawaban) ? [...q.kunci_jawaban].map(x => String(x).trim().toUpperCase()).sort() : [];
          const a = Array.isArray(ans) ? [...ans].map(x => String(x).trim().toUpperCase()).sort() : [];
          if (k.length && JSON.stringify(k) === JSON.stringify(a)) {
            autoObjectiveScore += bobot;
          }
        } else if (q.jenis_soal === 'BENAR_SALAH') {
          const keys = q.kunci_jawaban || [];
          if (keys.length) {
            let correctCount = 0;
            keys.forEach((kv, i) => {
              if (String(ans[i] || '').trim().toLowerCase() === String(kv).trim().toLowerCase()) {
                correctCount += 1;
              }
            });
            autoObjectiveScore += Math.round((correctCount / keys.length) * bobot);
          }
        } else if (q.jenis_soal === 'MENJODOHKAN') {
          const keyMap = q.kunci_jawaban || {};
          const leftKeys = Object.keys(keyMap);
          if (leftKeys.length) {
            let correctCount = 0;
            leftKeys.forEach(lk => {
              if (String(ans[lk] || '').trim() === String(keyMap[lk]).trim()) {
                correctCount += 1;
              }
            });
            autoObjectiveScore += Math.round((correctCount / leftKeys.length) * bobot);
          }
        } else if (q.jenis_soal === 'ISIAN_SINGKAT') {
          const accepted = Array.isArray(q.kunci_jawaban) ? q.kunci_jawaban : [String(q.kunci_jawaban)];
          const normAns = normalizeTextForGrading(ans);
          if (normAns && accepted.some(k => normalizeTextForGrading(k) === normAns)) {
            autoObjectiveScore += bobot;
          }
        } else if (q.jenis_soal === 'ESSAY') {
          autoEssayScore += gradeEssayAutomatically(q, ans);
        }
      });

      const totalScore = autoObjectiveScore + autoEssayScore;
      const showScoreFlag = Boolean(state.activeExam?.tampilkan_nilai);
      const studentId = state.currentUser?.data?.id;
      const hasilRow = {
        id: generateUuid(),
        ujian_id: state.activeExam.id,
        siswa_id: studentId,
        jawaban_siswa: state.examAnswers,
        skor_otomatis: autoObjectiveScore,
        skor_essay: autoEssayScore,
        skor_total: totalScore,
        jumlah_pelanggaran: state.examViolations,
        status_ujian: lockedByCheat ? 'Dikunci Pelanggaran' : 'Selesai',
        waktu_mulai: new Date(Date.now() - 600000).toISOString(),
        waktu_selesai: new Date().toISOString()
      };

      await dbInsert('cbt_hasil', hasilRow);
      // Otomatis nonaktifkan akun siswa setelah selesai ujian atau pelanggaran
      await deactivateSiswaAccount(studentId);

      state.activeExam = null;
      state.examLockedModalOpen = false;
      state.currentUser = null;
      state.loginTab = 'siswa';
      state.route = 'login';
      showToast(
        lockedByCheat
          ? 'Pelanggaran terdeteksi! Ujian dikunci & akun siswa dinonaktifkan (perlu persetujuan Admin untuk login kembali).'
          : (showScoreFlag
              ? `Ujian selesai! Nilai Total: ${totalScore}. Akun otomatis dinonaktifkan (perlu persetujuan Admin untuk login kembali).`
              : 'Ujian selesai & dinilai otomatis 100%! Akun dinonaktifkan (perlu persetujuan Admin untuk login kembali).'),
        lockedByCheat ? 'danger' : 'success'
      );
      render();
    };

    // =========================================================================
    // 20. RENDER ENGINE UTAMA & INISIALISASI APLIKASI
    // =========================================================================
    function render() {
      const root = document.getElementById('app-shell');
      if (!root) return;

      const activeEl = document.activeElement;
      const focusedId = activeEl && (activeEl.id === 'global-search-input' || activeEl.id === 'nilai-judul-input') ? activeEl.id : null;
      const selectionStart = focusedId ? activeEl.selectionStart : null;

      if (state.route === 'landing') {
        root.innerHTML = renderLandingPage();
      } else if (state.route === 'login') {
        root.innerHTML = renderLoginPage();
      } else if (state.route === 'admin') {
        root.innerHTML = renderAdminLayout();
      } else if (state.route === 'siswa-portal') {
        root.innerHTML = renderSiswaPortal();
      } else if (state.route === 'siswa-exam') {
        root.innerHTML = renderSiswaExam();
      }

      if (focusedId) {
        const restoredInput = document.getElementById(focusedId);
        if (restoredInput) {
          restoredInput.focus();
          if (selectionStart !== null) {
            restoredInput.setSelectionRange(selectionStart, selectionStart);
          }
        }
      }

      if (window.lucide) {
        lucide.createIcons();
      }
    }
    window.render = render;

    // Boot Application
    (async function initApp() {
      await autoSetupDatabase();
      render();
    })();
  </script>
</body>
</html>
